<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pnam | Portfolio</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@500;700&family=Press+Start+2P&display=swap"
        rel="stylesheet">

    <!-- Lenis for smooth scrolling -->
    <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="background-container">
        <div class="grain-overlay"></div>
        <div id="blobs-container">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>
    </div>

    <nav id="navbar">
        <ul id="nav-list">
            <div id="nav-blob"></div>
        </ul>
        <div id="nav-mini-text" class="hidden"></div>
    </nav>

    <main id="app">
        <section id="hero" class="section"></section>
        <section id="projects" class="section"></section>
        <section id="about" class="section"></section>
        <section id="contact" class="section"></section>
    </main>

    <footer id="footer"></footer>

    <div id="popup-overlay">
        <div id="popup-content"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
